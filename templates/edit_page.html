<head>

    <title>Resume Template</title>

<body>
                <form method="post">
                    <input
        placeholder="Enter Name"
        class="input-style"
        type="text"
        name="Full_name"
        value="{{ Header.Full_name }}"
      />

      <input
        placeholder="Enter Email"
        class="input-style"
        type="email"
        name="email"
        value="{{ Header.email }}"
      />

      <input
        placeholder="Enter Phone"
        class="input-style"
        type="number"
        name="phone"
        value="{{ Header.phone }}"
      />
      <textarea placeholder="E.g :-I am an experienced digital marketer with 7 years of expertise in brand strategy." class="input-style"  name="User_Description" value="{{ Description.User_Description }}"></textarea>
                        <h3 style="margin-top: 20px; font-size: 1.1em;">Your Skills</h3>
                        <input type="text" placeholder="Skill 1" class="input-style" name="skills1" value="{{ Description.skills1 }}">
                        <input type="text" placeholder="Skill 2" class="input-style" name="skills2" value="{{ Description.skills2 }}">
                        <input type="text" placeholder="Skill 3" class="input-style" name="skills3" value="{{ Description.skills3 }}">
                        <input type="text" placeholder="Skill 4" class="input-style" name="skills4" value="{{ Description.skills4 }}">
                    <label for="Project_name1">Project 1 name</label>
          <input
            type="text"
            name="Project_name1"
            id="Project_name1"
            class="form-input"
            placeholder="Example: Resume Builder Dashboard"
            value="{{ Project.Project_name1 }}"
          />
        </div>

        <div class="field-group">
          <label for="Project_description1">Project 1 description</label>
          <textarea
            name="Project_description1"
            id="Project_description1"
            class="form-textarea"
            placeholder="Describe the goal, tools, and result in one or two sentences."
            value="{{ Project.Project_description1 }}"
          ></textarea>
        </div>

        <div class="field-group">
          <label for="Project_name2">Project 2 name</label>

        <div class="field-group">
          <label for="Project_description2">Project 2 description</label>
          <textarea
            name="Project_description2"
            id="Project_description2"
            class="form-textarea"
            
            placeholder="Keep it crisp, specific, and results-focused."
          ></textarea>    
          <div class="field-group">

          <input
            type="text"

            class="form-input"
            placeholder="Example: Resume Builder Dashboard"
            value="{{ Work.Work_name1 }}"
          />
        </div>
        <div class="date-range">
          <div class="input-group">
            <label for="startdate_1">Start Date</label>
            <input type="date" name="startdate_1" id="startdate_1" />
          </div>

          <div class="input-group">
            <label for="enddate_1">End Date</label>
            <input type="date" name="enddate_1" id="enddate_1" />
          </div>
        </div>
        <div class="field-group">
          <label for="Project_description1">Work 1 description</label>
          <textarea
            name="Work_description1"
            id="Project_description1"
            class="form-textarea"
            placeholder="{{ Work.Work_description2 }}"
            
            ></textarea>
        </div>

            />

        </div>
