
 <!--! It shows the template with the Correct name and body   -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Template</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
        crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Template.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ Description_section.css') }}"/>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,500;0,1000;1,400;1,900&display=swap');
</style>
</head>
<body>
    <div class="main_container">
        <!-- Resume Preview Section -->
          </div>
            <div class="card_right">
        <div class="tools">
            <div class="circle red"></div>
            <div class="circle yellow"></div>
            <div class="circle green"></div>
        </div>
            <div class="card__content">
                <form method="post">
                    <div class="rightside_container">
                        <h1 class="rightside_container_text">How your resume template looks like</h1>
                        <h2>Enter Description</h2>
                        <textarea placeholder="E.g :-I am an experienced digital marketer with 7 years of expertise in brand strategy." class="input-style"  name="User_Description" required></textarea>
                        <h3 style="margin-top: 20px; font-size: 1.1em;">Your Skills</h3>
                        <input type="text" placeholder="Skill 1" class="input-style" name="skills1" required>
                        <input type="text" placeholder="Skill 2" class="input-style" name="skills2" required>
                        <input type="text" placeholder="Skill 3" class="input-style" name="skills3" required>
                        <input type="text" placeholder="Skill 4" class="input-style" name="skills4" required>
                        <div class="template_page_btns">
                        <button type="submit" id="next_btn_edit">
                            <a  style="color: inherit; display: inline-flex; align-items: center; gap: 8px; text-decoration: none;">
                                <span>Next step</span>
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                    <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25Zm4.28 10.28a.75.75 0 0 0 0-1.06l-3-3a.75.75 0 1 0-1.06 1.06l1.72 1.72H8.25a.75.75 0 0 0 0 1.5h5.69l-1.72 1.72a.75.75 0 1 0 1.06 1.06l3-3Z" clip-rule="evenodd" />
                                </svg>
                            </a>
                        </button> 
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
        

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpb5zoSMXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
