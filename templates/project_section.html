{% extends "nav_bar.html" %} {% block content %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/project_section.css') }}"
/>

<section class="resume-builder-shell">
  <div class="resume-builder-hero">
    <div>
      <h1>Project section</h1>
    </div>
  </div>

  <div class="resume-builder-grid">
    <aside class="editor-card">
      <div class="editor-card__header">
        <h2>Add project details</h2>
        <p>
          Write two project entries that are easy to read and professionally
          framed.
        </p>
      </div>

      <form class="project-form" method="post">
        <div class="field-group">
          <label for="Project_name1">Project 1 name</label>
          <input
            type="text"
            name="Project_name1"
            id="Project_name1"
            class="form-input"
            placeholder="Example: Resume Builder Dashboard"
          />
        </div>

        <div class="field-group">
          <label for="Project_description1">Project 1 description</label>
          <textarea
            name="Project_description1"
            id="Project_description1"
            class="form-textarea"
            placeholder="Describe the goal, tools, and result in one or two sentences."
          ></textarea>
        </div>

        <div class="field-group">
          <label for="Project_name2">Project 2 name</label>
          <input
            type="text"
            name="Project_name2"
            id="Project_name2"
            class="form-input"
            placeholder="Example: Portfolio Site Refresh"
          />
        </div>

        <div class="field-group">
          <label for="Project_description2">Project 2 description</label>
          <textarea
            name="Project_description2"
            id="Project_description2"
            class="form-textarea"
            placeholder="Keep it crisp, specific, and results-focused."
          ></textarea>
        </div>

        <div class="form-actions">
          <!-- <button type="button" class="secondary-btn">Save draft</button> -->
          <button type="submit" class="primary-btn">Continue</button>
        </div>
      </form>
    </aside>
  </div>
</section>
{% endblock %}
